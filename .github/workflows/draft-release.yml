name: Draft Release
on:
    pull_request:
        types: [closed]
        branches: [main]

jobs:
    draft-release:
        name: Create Draft Release
        # Only for merged release PRs (release/<version> branches).
        if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}

            - name: Get version
              id: version
              run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

            # Catches a release branch merged without running bin/bump-version.sh.
            - name: Check the version matches the branch name
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  if [ "release/${VERSION}" != "${BRANCH}" ]; then
                      echo "::error::package.json version ${VERSION} does not match the branch ${BRANCH}. Run bin/bump-version.sh."
                      exit 1
                  fi

            - name: Extract release notes from the changelog
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  awk -v heading="### ${VERSION}" '
                      $0 == heading { found = 1; next }
                      found && /^#/ { exit }
                      found { print }
                  ' README.md > release-notes.md

                  if [ ! -s release-notes.md ]; then
                      echo "::error::README.md has no changelog entries under ### ${VERSION}."
                      exit 1
                  fi

            # The tag is created on the merge commit when the draft is published in the web UI.
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  TARGET: ${{ github.event.pull_request.merge_commit_sha }}
              run: gh release create "$VERSION" --draft --target "$TARGET" --title "$VERSION" --notes-file release-notes.md
