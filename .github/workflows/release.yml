name: Release
on:
    release:
        types: [published]

jobs:
    # Catches a release created by hand, or a draft whose tag was edited.
    check-version:
        name: Check Version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # The release's own prerelease flag decides whether the Stable tag is checked.
            - name: Check the tag matches the versions in the files
              env:
                  TAG: ${{ github.event.release.tag_name }}
                  KIND: ${{ github.event.release.prerelease && 'prerelease' || 'stable' }}
              run: bin/check-version.sh "$TAG" "$KIND"

    lint:
        name: Lint
        needs: check-version
        uses: ./.github/workflows/lint.yml

    test:
        name: Test
        needs: check-version
        uses: ./.github/workflows/test.yml
        # The PHPUnit job requests an OIDC token for the AI tests.
        permissions:
            id-token: write
            contents: read

    release:
        name: Upload Release Asset
        needs: [check-version, lint, test]
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            id-token: write
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Get tag
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: slug-automator

            - name: Upload release asset
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
