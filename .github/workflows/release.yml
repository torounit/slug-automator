name: Release
on:
    release:
        types: [published]

jobs:
    # Catches a release created by hand, or a draft whose tag was edited.
    check-version:
        name: Check Version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Check the tag matches the versions in the files
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  package_version=$(node -p 'require("./package.json").version')
                  header_version=$(sed -nE 's/^ \* Version: *(.*)$/\1/p' slug-automator.php)
                  stable_tag=$(sed -nE 's/^Stable tag: *([^ ]*) *$/\1/p' README.md)

                  status=0
                  if [ "${TAG}" != "${package_version}" ]; then
                      echo "::error::The tag ${TAG} does not match package.json (${package_version})."
                      status=1
                  fi
                  if [ "${TAG}" != "${header_version}" ]; then
                      echo "::error::The tag ${TAG} does not match the Version header in slug-automator.php (${header_version})."
                      status=1
                  fi
                  # Prereleases leave the Stable tag on the last stable release.
                  if ! echo "${TAG}" | grep -qE "alpha|beta|RC|rc" && [ "${TAG}" != "${stable_tag}" ]; then
                      echo "::error::The tag ${TAG} does not match the Stable tag in README.md (${stable_tag})."
                      status=1
                  fi
                  exit $status

    lint:
        name: Lint
        uses: ./.github/workflows/lint.yml

    test:
        name: Test
        uses: ./.github/workflows/test.yml
        # The PHPUnit job requests an OIDC token for the AI tests.
        permissions:
            id-token: write
            contents: read

    release:
        name: Upload Release Asset
        needs: [check-version, lint, test]
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            id-token: write
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Get tag
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: slug-automator

            - name: Upload release asset
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
