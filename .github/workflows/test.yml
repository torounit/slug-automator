name: Test
on:
    pull_request:
        paths-ignore:
            - '**.md'
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
    workflow_call:

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # Blocks malicious npm packages: npm and npx run through Aikido Safe Chain from here on.
            - name: Install Aikido Safe Chain
              run: |
                  curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o /tmp/install-safe-chain.sh
                  echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  /tmp/install-safe-chain.sh" | sha256sum -c -
                  sh /tmp/install-safe-chain.sh --ci
                  rm /tmp/install-safe-chain.sh

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies
              run: npm ci

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            # Runs the AI tests against Claude when Workload Identity Federation is configured.
            # Pull requests from forks cannot request an OIDC token, so the AI tests are skipped there.
            - name: Exchange GitHub OIDC token for a Claude API access token
              id: claude
              if: >-
                  vars.ANTHROPIC_FEDERATION_RULE_ID != '' &&
                  (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              env:
                  ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
                  ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
                  ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
                  ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
              run: |
                  jwt=$(curl -sS --fail-with-body -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)

                  access_token=$(jq -n \
                      --arg assertion "$jwt" \
                      --arg federation_rule_id "$ANTHROPIC_FEDERATION_RULE_ID" \
                      --arg organization_id "$ANTHROPIC_ORGANIZATION_ID" \
                      --arg service_account_id "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
                      --arg workspace_id "$ANTHROPIC_WORKSPACE_ID" \
                      '{
                          grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                          assertion: $assertion,
                          federation_rule_id: $federation_rule_id,
                          organization_id: $organization_id,
                          service_account_id: $service_account_id
                      } + (if $workspace_id != "" then { workspace_id: $workspace_id } else {} end)' \
                      | curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
                          -H "content-type: application/json" --data @- \
                      | jq -r .access_token)

                  if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
                      echo "::error::Failed to obtain a Claude API access token."
                      exit 1
                  fi

                  echo "::add-mask::$access_token"
                  jq -n --arg key "$access_token" '{ config: { ANTHROPIC_API_KEY: $key } }' > .wp-env.test.override.json

            # Fail on skipped tests when a token is available so that a misconfigured key does not silently pass.
            - name: Run PHPUnit
              run: npm run test:php:setup && npm run test:php:base -- ${{ steps.claude.outcome == 'success' && '--fail-on-skipped' || '' }}
