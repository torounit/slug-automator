name: Test and Deploy
on:
    pull_request:
        paths-ignore:
            - '**.md'
    push:
        branches: [main]
        tags: ['*']
        paths-ignore:
            - '**.md'

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies
              run: npm ci

            - name: Hotpatch @wordpress/env from Gutenberg PR #78828
              run: |
                  if ! npm ls adm-zip --depth=0 >/dev/null 2>&1; then
                      npm install --no-save adm-zip@^0.5.9
                  fi
                  curl -fsSL \
                      https://raw.githubusercontent.com/WordPress/gutenberg/23d0f38cddf3f53a2b182bf987a2e237c779f7d0/packages/env/lib/download-sources.js \
                      -o node_modules/@wordpress/env/lib/download-sources.js
                  grep -q "const AdmZip = require( 'adm-zip' );" node_modules/@wordpress/env/lib/download-sources.js
                  ! grep -q "extract-zip" node_modules/@wordpress/env/lib/download-sources.js

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHPUnit
              run: npm run test:php

    release:
        name: Upload Release Asset
        needs: [phpunit]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            id-token: write
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get tag
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: slug-automator

            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
