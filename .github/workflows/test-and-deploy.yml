name: Test and Deploy
on:
    pull_request:
        paths-ignore:
            - '**.md'
    push:
        branches: [main]
        tags: ['*']
        paths-ignore:
            - '**.md'

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.16.0'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies
              run: npm ci

            - name: Hotpatch @wordpress/env (Gutenberg PR #78828)
              run: |
                  node <<'NODE'
                  const fs = require('fs');
                  const file = 'node_modules/@wordpress/env/lib/download-sources.js';
                  let src = fs.readFileSync(file, 'utf8');

                  const beforeRequire = "const got = require( 'got' );\nconst SimpleGit = require( 'simple-git' );";
                  const afterRequire = "const got = require( 'got' );\nconst AdmZip = require( 'adm-zip' );\nconst SimpleGit = require( 'simple-git' );";

                  const beforeExtractImport = "const extractZip = util.promisify( require( 'extract-zip' ) );\nconst { rimraf } = require( 'rimraf' );";
                  const afterExtractImport = "const { rimraf } = require( 'rimraf' );";

                  const beforeExtractCall = "\tawait extractZip( zipName, { dir: tempDir } );";
                  const afterExtractCall = "\tconst zip = new AdmZip( zipName );\n\tawait util.promisify( zip.extractAllToAsync.bind( zip ) )(\n\t\ttempDir,\n\t\t/* overwrite */ true,\n\t\t/* keepOriginalPermission */ false\n\t);";

                  src = src.replace(beforeRequire, afterRequire);
                  src = src.replace(beforeExtractImport, afterExtractImport);
                  src = src.replace(beforeExtractCall, afterExtractCall);

                  if (!src.includes("const AdmZip = require( 'adm-zip' );") || src.includes("extract-zip")) {
                    throw new Error('Failed to apply @wordpress/env hotpatch');
                  }

                  fs.writeFileSync(file, src);
                  console.log('Hotpatch applied:', file);
                  NODE

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHPUnit
              run: npm run test:php

    release:
        name: Upload Release Asset
        needs: [phpunit]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            id-token: write
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get tag
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Node dependencies and build
              run: npm ci && npm run build

            - name: Install Composer production dependencies
              run: composer install --no-dev --no-progress --no-interaction --optimize-autoloader

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: slug-automator

            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
